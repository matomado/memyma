<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>memyma · 빚 & 부수입</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <h1>memyma</h1>
    <nav class="tabs" role="tablist">
      <button class="tab active" data-tab="summary">요약</button>
      <button class="tab" data-tab="debts">빚</button>
      <button class="tab" data-tab="income">부수입</button>
      <button class="tab" data-tab="settings">백업</button>
    </nav>
  </header>

  <main>
    <!-- 요약 -->
    <section id="tab-summary" class="panel active">
      <div class="stats">
        <div class="stat">
          <span class="label">남은 빚</span>
          <span class="value" id="s-remaining">0원</span>
          <span class="sub" id="s-remaining-sub"></span>
        </div>
        <div class="stat">
          <span class="label">지금까지 갚은 돈</span>
          <span class="value good" id="s-paid">0원</span>
          <span class="sub" id="s-paid-sub"></span>
        </div>
        <div class="stat">
          <span class="label">이번 달 부수입</span>
          <span class="value accent" id="s-month-income">0원</span>
          <span class="sub" id="s-month-income-sub"></span>
        </div>
        <div class="stat">
          <span class="label">누적 부수입</span>
          <span class="value accent" id="s-total-income">0원</span>
          <span class="sub" id="s-total-income-sub"></span>
        </div>
      </div>

      <div class="card">
        <div class="progress-head">
          <h2>빚 상환 진행률</h2>
          <strong id="s-progress-pct">0%</strong>
        </div>
        <div class="progress"><div class="bar" id="s-progress-bar"></div></div>
        <p class="hint" id="s-forecast"></p>
      </div>

      <div class="card">
        <h2>남은 빚 추이</h2>
        <div class="chart" id="chart-debt"></div>
      </div>

      <div class="card">
        <h2>월별 부수입 (최근 12개월)</h2>
        <div class="chart" id="chart-income"></div>
      </div>
    </section>

    <!-- 빚 -->
    <section id="tab-debts" class="panel">
      <div class="card">
        <h2>빚 추가</h2>
        <form id="form-debt" class="form">
          <label>이름<input name="name" required placeholder="예: 학자금 대출" /></label>
          <label>원래 금액<input name="principal" required inputmode="numeric" placeholder="10,000,000" /></label>
          <label>시작일<input name="startDate" type="date" required /></label>
          <button type="submit">추가</button>
        </form>
      </div>

      <div class="card">
        <h2>상환 기록</h2>
        <form id="form-payment" class="form">
          <label>어떤 빚<select name="debtId" required></select></label>
          <label>갚은 금액<input name="amount" required inputmode="numeric" placeholder="300,000" /></label>
          <label>날짜<input name="date" type="date" required /></label>
          <label>메모<input name="memo" placeholder="선택" /></label>
          <button type="submit">기록</button>
        </form>
      </div>

      <div id="debt-list"></div>
    </section>

    <!-- 부수입 -->
    <section id="tab-income" class="panel">
      <div class="card">
        <h2>부수입 기록</h2>
        <form id="form-income" class="form">
          <label>출처<input name="source" required list="source-list" placeholder="예: 블로그, 중고거래" /></label>
          <datalist id="source-list"></datalist>
          <label>금액<input name="amount" required inputmode="numeric" placeholder="50,000" /></label>
          <label>날짜<input name="date" type="date" required /></label>
          <label>메모<input name="memo" placeholder="선택" /></label>
          <button type="submit">기록</button>
        </form>
      </div>

      <div class="card">
        <h2>출처별 합계</h2>
        <div id="income-by-source"></div>
      </div>

      <div class="card">
        <h2>기록</h2>
        <div id="income-list"></div>
      </div>
    </section>

    <!-- 백업 -->
    <section id="tab-settings" class="panel">
      <div class="card">
        <h2>데이터 백업</h2>
        <p class="hint">모든 데이터는 이 브라우저에만 저장돼요. 기기를 바꾸거나 브라우저 데이터를 지우기 전에 백업 파일을 내려받아 두세요.</p>
        <div class="row">
          <button id="btn-export">백업 파일 내려받기</button>
          <label class="file-btn">백업 파일 불러오기<input type="file" id="file-import" accept="application/json" hidden /></label>
        </div>
      </div>
      <div class="card danger-zone">
        <h2>초기화</h2>
        <p class="hint">모든 빚·상환·부수입 기록을 지웁니다.</p>
        <button id="btn-reset" class="danger">전체 삭제</button>
      </div>
    </section>
  </main>

  <div id="toast" class="toast" role="status"></div>
  <script src="app.js"></script>
</body>
</html>
