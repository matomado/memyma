<title>4만원의 행복</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: receipt-style budget header on top, then cart + requests (main) beside add form + reorder shelf (side); stacks on phones */
:root{
  --bg:#f3f5f2; --surface:#ffffff; --sunk:#e8ece7; --line:#d3dad2;
  --fg:#1d2621; --muted:#5f6b63; --accent:#0d6b57; --accent-fg:#ffffff; --accent-soft:#dcefe8;
  --mustard:#c98a00; --mustard-soft:#fbefd0; --danger:#b3261e; --danger-soft:#fbe3e0;
  --display:"Black Han Sans","IBM Plex Sans KR",system-ui,sans-serif;
  --body:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141a17; --surface:#1c2420; --sunk:#232d28; --line:#33403a;
  --fg:#e6ece8; --muted:#9aa8a0; --accent:#4cc3a3; --accent-fg:#0b1a15; --accent-soft:#1f3a32;
  --mustard:#f0b93a; --mustard-soft:#3a3018; --danger:#ff8a80; --danger-soft:#3d2220; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141a17; --surface:#1c2420; --sunk:#232d28; --line:#33403a;
  --fg:#e6ece8; --muted:#9aa8a0; --accent:#4cc3a3; --accent-fg:#0b1a15; --accent-soft:#1f3a32;
  --mustard:#f0b93a; --mustard-soft:#3a3018; --danger:#ff8a80; --danger-soft:#3d2220; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1,h2{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance;letter-spacing:.01em}
h1{font-size:1.9rem;line-height:1.1}
h2{font-size:1.2rem}
::placeholder{font-family:"Malgun Gothic","맑은 고딕","Apple SD Gothic Neo",sans-serif}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.muted{color:var(--muted)}
.small{font-size:.82rem}

/* top bar */
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.eyebrow{font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.monthnav{display:flex;align-items:center;gap:6px}
.iconbtn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:1.1rem}
.iconbtn:hover{border-color:var(--accent)}
.monthlabel{font-family:var(--display);font-size:1.35rem;min-width:8.5em;text-align:center}

/* receipt */
.receipt{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:16px 24px;position:relative}
.receipt::after{content:"";position:absolute;left:12px;right:12px;bottom:-1px;height:6px;background:radial-gradient(circle at 6px 6px,var(--bg) 4px,transparent 4.5px) repeat-x;background-size:12px 12px;transform:translateY(50%)}
.stat .lab{font-size:.78rem;color:var(--muted);font-weight:500}
.stat .val{font-family:var(--mono);font-size:1.5rem;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.2}
.stat .val.big{font-size:1.9rem}
.stat.over .val{color:var(--danger)}
.budgetedit{display:flex;align-items:center;gap:6px}
.budgetedit input{width:7.5em;font-family:var(--mono);font-size:1.2rem;font-weight:600;border:1px solid var(--line);background:var(--sunk);border-radius:8px;padding:4px 8px}
.meter{grid-column:1/-1;display:flex;flex-direction:column;gap:6px}
.bar{height:14px;background:var(--sunk);border-radius:7px;overflow:hidden;display:flex}
.bar i{display:block;height:100%;background:var(--accent);transition:width .3s}
.bar i.wish{background:repeating-linear-gradient(45deg,var(--mustard) 0 6px,var(--mustard-soft) 6px 12px);opacity:.8}
.bar.over i{background:var(--danger)}
.legend{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:.8rem;color:var(--muted)}
.legend b{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px;background:var(--accent)}
.legend b.w{background:var(--mustard)}
.actions{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px;align-items:center}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:500;font-size:.88rem;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.primary:hover{filter:brightness(1.08);color:var(--accent-fg)}
.btn.ghost{border-color:transparent;background:transparent}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 10px;font-size:.78rem;font-weight:700}
.pill.done{background:var(--accent-soft);color:var(--accent)}
.pill.open{background:var(--mustard-soft);color:var(--mustard)}

/* grid */
.grid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:820px){.grid{grid-template-columns:minmax(0,1fr)}}
.col{display:flex;flex-direction:column;gap:20px;min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel.flat{background:transparent;border-style:dashed}
.phead{display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap}
.phead .sum{font-family:var(--mono);font-weight:600;font-variant-numeric:tabular-nums}

/* rows */
.list{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;padding:11px 0;border-top:1px solid var(--line);align-items:center}
.row:first-child{border-top:0}
.row .name{font-weight:500;overflow-wrap:anywhere}
.row .name a{color:inherit;text-decoration:none;border-bottom:1px solid var(--line)}
.row .name a:hover{color:var(--accent);border-color:var(--accent)}
.row .meta{font-size:.78rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:2px 10px}
.row .right{display:flex;align-items:center;gap:6px;justify-content:flex-end;flex-wrap:wrap}
.row .sub{font-family:var(--mono);font-weight:600;min-width:6.2em;text-align:right;font-variant-numeric:tabular-nums}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.qty button{border:0;background:transparent;width:28px;height:28px}
.qty button:hover{background:var(--sunk)}
.qty span{min-width:1.6em;text-align:center;font-family:var(--mono);font-weight:600}
.price{width:6.4em;text-align:right;font-family:var(--mono);border:1px solid transparent;background:transparent;border-radius:6px;padding:3px 6px}
.price:hover,.price:focus{border-color:var(--line);background:var(--sunk)}
.price.missing{border-color:var(--mustard);background:var(--mustard-soft)}
.x{border:0;background:transparent;color:var(--muted);width:28px;height:28px;border-radius:50%}
.x:hover{background:var(--danger-soft);color:var(--danger)}
.vote{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 10px;font-size:.85rem;display:inline-flex;gap:5px;align-items:center}
.vote.on{background:var(--mustard-soft);border-color:var(--mustard);color:var(--mustard);font-weight:700}
.tag{font-size:.72rem;border-radius:4px;padding:0 6px;background:var(--sunk);color:var(--muted)}
.tag.warn{background:var(--danger-soft);color:var(--danger)}
@media (max-width:560px){.row{grid-template-columns:minmax(0,1fr)}.row .right{justify-content:flex-start}.row .sub{min-width:0;margin-left:auto}}
.empty{padding:18px;text-align:center;color:var(--muted);font-size:.9rem;border:1px dashed var(--line);border-radius:8px}

.suggest{background:var(--mustard-soft);border-radius:8px;padding:10px 12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;font-size:.88rem}
.suggest b{font-family:var(--mono)}

/* form */
form{display:flex;flex-direction:column;gap:10px}
label{display:flex;flex-direction:column;gap:4px;font-size:.8rem;color:var(--muted);font-weight:500}
.field{border:1px solid var(--line);background:var(--sunk);border-radius:8px;padding:8px 10px;width:100%;min-width:0;color:var(--fg)}
.field:focus{border-color:var(--accent);background:var(--surface)}
.two{display:grid;grid-template-columns:minmax(0,1fr) 5.5em;gap:8px}
.seg{display:flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--sunk)}
.seg label{flex:1;flex-direction:row;justify-content:center;cursor:pointer;border-radius:999px;padding:6px 8px;font-size:.85rem;color:var(--fg);gap:0}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label:has(input:checked){background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.12);font-weight:700}
.hint{font-size:.78rem;color:var(--muted)}
.hint.ok{color:var(--accent)}

.shelf .row{grid-template-columns:minmax(0,1fr) auto}
.count{font-family:var(--mono);font-size:.75rem;color:var(--accent);font-weight:600}

.notice{background:var(--mustard-soft);color:var(--fg);border-radius:8px;padding:10px 14px;font-size:.88rem}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:.88rem;opacity:0;pointer-events:none;transition:.25s;z-index:20;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translateX(-50%)}
details summary{cursor:pointer;color:var(--muted);font-size:.85rem}
textarea.copy{width:100%;height:160px;font-family:var(--mono);font-size:.8rem;border:1px solid var(--line);border-radius:8px;background:var(--sunk);color:var(--fg);padding:8px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <header class="top">
    <div>
      <h1>4만원의 행복</h1>
    </div>
    <div class="monthnav">
      <button class="iconbtn" id="prevM" aria-label="이전 달">‹</button>
      <div class="monthlabel" id="monthLabel">—</div>
      <button class="iconbtn" id="nextM" aria-label="다음 달">›</button>
    </div>
  </header>

  <div id="notice" class="notice" hidden></div>

  <section class="receipt" id="receipt" aria-label="이번 달 예산">
    <div class="stat">
      <div class="lab">월 예산</div>
      <div class="budgetedit"><input id="budget" class="num" inputmode="numeric" aria-label="월 예산"><span class="muted">원</span></div>
    </div>
    <div class="stat"><div class="lab">장바구니 합계</div><div class="val" id="sumCart">0</div></div>
    <div class="stat" id="remainBox"><div class="lab" id="remainLab">남은 예산</div><div class="val big" id="remain">0</div></div>
    <div class="meter">
      <div class="bar" id="bar"><i id="barCart" style="width:0"></i><i class="wish" id="barWish" style="width:0"></i></div>
      <div class="legend"><span><b></b>장바구니</span><span><b class="w"></b>신청함에서 가격 있는 것 전부 담으면</span><span id="wishTotal"></span></div>
    </div>
    <div class="actions">
      <span id="statusPill" class="pill open">주문 전</span>
      <button class="btn" id="copyBtn">주문 목록 복사</button>
      <button class="btn" id="csvBtn" hidden>엑셀(CSV) 저장</button>
      <button class="btn primary" id="orderBtn">주문 완료로 표시</button>
    </div>
  </section>

  <div class="grid">
    <div class="col">
      <section class="panel">
        <div class="phead"><h2>장바구니</h2><span class="muted small">이번 달 실제로 주문할 것</span></div>
        <div id="suggest"></div>
        <div class="list" id="cartList"></div>
      </section>
      <section class="panel">
        <div class="phead"><h2>신청함</h2><span class="muted small">먹고 싶은 걸 올리고 👍로 투표하세요</span></div>
        <div class="list" id="wishList"></div>
      </section>
      <details id="copyWrap" hidden><summary>복사가 안 되면 여기서 직접 선택하세요</summary><textarea class="copy" id="copyText" readonly></textarea></details>
    </div>

    <div class="col">
      <section class="panel" id="addPanel">
        <div class="phead"><h2>간식 추가</h2></div>
        <form id="addForm" autocomplete="off">
          <label>쿠팡 링크 <input class="field" id="fUrl" placeholder="https://www.coupang.com/vp/products/..."></label>
          <div class="hint" id="urlHint">링크를 붙여넣으면 추적용 파라미터를 지우고 짧게 저장해요.</div>
          <label>상품명 <input class="field" id="fName" placeholder="예: 카프리썬 오렌지망고 20EA" required></label>
          <div class="two">
            <label>가격(원) <input class="field num" id="fPrice" inputmode="numeric" placeholder="모르면 비워두기"></label>
            <label>개수 <input class="field num" id="fQty" type="number" min="1" value="1"></label>
          </div>
          <div class="seg" role="radiogroup" aria-label="어디에 넣을까요">
            <label><input type="radio" name="dest" id="destWish" value="wish" checked>신청함에 올리기</label>
            <label><input type="radio" name="dest" id="destCart" value="cart">장바구니에 바로</label>
          </div>
          <div class="hint" id="fitHint"></div>
          <button class="btn primary" type="submit" id="addBtn" style="justify-content:center">추가</button>
        </form>
      </section>

      <section class="panel flat shelf">
        <div class="phead"><h2>자주 산 간식</h2><span class="muted small">지난달 기록에서 바로 담기</span></div>
        <div class="list" id="shelf"></div>
      </section>
    </div>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const won = n => (Math.round(n) || 0).toLocaleString("ko-KR");
  const toNum = s => { const n = parseInt(String(s ?? "").replace(/[^\d]/g, ""), 10); return isNaN(n) ? null : n; };
  const DEFAULT_BUDGET = 40000;
  const mkey = d => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0");
  const shift = (k, n) => { const [y, m] = k.split("-").map(Number); return mkey(new Date(y, m - 1 + n, 1)); };
  const mlabel = k => { const [y, m] = k.split("-"); return `${y}년 ${Number(m)}월`; };
  const safeUrl = u => (typeof u === "string" && u.startsWith("https://")) ? u : "";

  // Coupang link cleanup: keep product / item / vendor ids, drop search tracking
  function parseCoupang(raw) {
    raw = (raw || "").trim();
    if (!raw) return null;
    let u; try { u = new URL(raw); } catch { return { bad: true }; }
    if (u.protocol !== "https:") return { bad: true };
    const m = u.pathname.match(/\/vp\/products\/(\d+)/);
    if (!/coupang\.com$/.test(u.hostname) || !m) return { url: u.href, pid: null, q: null };
    const p = new URLSearchParams();
    if (u.searchParams.get("itemId")) p.set("itemId", u.searchParams.get("itemId"));
    if (u.searchParams.get("vendorItemId")) p.set("vendorItemId", u.searchParams.get("vendorItemId"));
    const clean = "https://www.coupang.com/vp/products/" + m[1] + (p.toString() ? "?" + p : "");
    return { url: clean, pid: m[1] + (u.searchParams.get("itemId") ? "-" + u.searchParams.get("itemId") : ""), q: u.searchParams.get("q") };
  }

  const state = { items: [], months: {}, votes: [], uid: null, canWrite: true, month: mkey(new Date()), loaded: false };
  let db = null, user = null, downloads = null;
  const saveMonth = k => { try { localStorage.setItem("snack.month", k); } catch {} };
  try { const k = localStorage.getItem("snack.month"); if (k && /^\d{4}-\d{2}$/.test(k)) state.month = k; } catch {}

  function toast(msg) { const t = $("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), 2200); }
  function notice(msg) { const n = $("notice"); n.textContent = msg || ""; n.hidden = !msg; }

  const monthDoc = k => state.months[k] || { budget: DEFAULT_BUDGET, ordered: false };
  const itemsOf = (k, st) => state.items.filter(i => i.month === k && (!st || i.status === st));
  const votesOf = id => state.votes.filter(v => v.item === id);
  const total = list => list.reduce((s, i) => s + (i.price || 0) * (i.qty || 1), 0);

  // ---------- writes ----------
  async function guard(p, okMsg) {
    try { await p; if (okMsg) toast(okMsg); }
    catch (e) {
      if (e && e.code === "invalid_argument") { state.canWrite = false; render(); notice("이 문서는 보기 전용이에요. 편집 권한(Contributor 이상)이 있어야 간식을 추가할 수 있어요."); }
      else if (e && e.code === "quota_exceeded") toast("저장 공간이 가득 찼어요. 오래된 항목을 지워주세요.");
      else toast("저장하지 못했어요. 잠시 후 다시 시도해주세요.");
    }
  }
  const setMonth = (k, patch) => db && guard(db.doc("months/" + k).set({ ...monthDoc(k), ...patch }));
  const upd = (id, patch) => db && guard(db.doc("items/" + id).update(patch));
  const delItem = id => db && guard(Promise.all([db.doc("items/" + id).delete(), ...votesOf(id).map(v => db.doc("votes/" + v.id).delete())]), "삭제했어요");
  const addItem = data => db && guard(db.collection("items").add({ createdAt: new Date().toISOString(), by: state.uid, ...data }));

  // ---------- render ----------
  function render() {
    const k = state.month, md = monthDoc(k), locked = !!md.ordered, can = state.canWrite && !!db;
    const editable = can && !locked;
    $("monthLabel").textContent = mlabel(k);
    const cart = itemsOf(k, "cart"), wish = itemsOf(k, "wish");
    const budget = md.budget ?? DEFAULT_BUDGET;
    const sum = total(cart), remain = budget - sum;
    const wishPriced = wish.filter(i => i.price);
    const wishSum = total(wishPriced);

    const b = $("budget"); if (document.activeElement !== b) b.value = won(budget); b.disabled = !editable;
    $("sumCart").textContent = won(sum) + "원";
    $("remain").textContent = (remain < 0 ? "−" : "") + won(Math.abs(remain)) + "원";
    $("remainLab").textContent = remain < 0 ? "예산 초과" : "남은 예산";
    $("remainBox").classList.toggle("over", remain < 0);
    const scale = Math.max(budget, sum + wishSum, 1);
    $("barCart").style.width = Math.min(100, sum / scale * 100) + "%";
    $("barWish").style.width = Math.min(100 - sum / scale * 100, wishSum / scale * 100) + "%";
    $("bar").classList.toggle("over", remain < 0);
    $("wishTotal").textContent = wishPriced.length ? `→ ${won(sum + wishSum)}원 (${sum + wishSum > budget ? won(sum + wishSum - budget) + "원 초과" : "예산 안"})` : "";

    const pill = $("statusPill");
    pill.className = "pill " + (locked ? "done" : "open");
    pill.textContent = locked ? "주문 완료" + (md.orderedAt ? " · " + md.orderedAt.slice(5, 10).replace("-", "/") : "") : "주문 전";
    const ob = $("orderBtn");
    ob.textContent = locked ? "다시 열기" : "주문 완료로 표시";
    ob.className = locked ? "btn ghost" : "btn primary";
    ob.hidden = !can;
    ob.disabled = !locked && !cart.length;

    // suggestion: fill remaining budget from the request box (most votes first, then cheapest)
    const sug = $("suggest");
    sug.innerHTML = "";
    if (editable && remain > 0) {
      const ranked = wishPriced.slice().sort((a, b) => votesOf(b.id).length - votesOf(a.id).length || a.price * a.qty - b.price * b.qty);
      let left = remain; const pick = [];
      for (const it of ranked) { const c = it.price * (it.qty || 1); if (c <= left) { pick.push(it); left -= c; } }
      if (pick.length) {
        const d = document.createElement("div"); d.className = "suggest";
        d.innerHTML = `<span>추천: 신청함에서 <b>${pick.length}개</b> 더 담으면 잔액 <b>${won(left)}원</b><br><span class="small muted">${pick.map(p => esc(p.name)).join(" · ")}</span></span>`;
        const btn = document.createElement("button"); btn.className = "btn primary"; btn.textContent = "추천대로 담기";
        btn.onclick = () => Promise.all(pick.map(p => db.doc("items/" + p.id).update({ status: "cart" }))).then(() => toast(`${pick.length}개 담았어요`), () => toast("담지 못했어요"));
        d.append(btn); sug.append(d);
      }
    }

    // cart
    const cl = $("cartList"); cl.innerHTML = "";
    if (!cart.length) cl.innerHTML = `<div class="empty">${state.loaded ? (locked ? "이 달에는 주문 기록이 없어요." : "아직 비어 있어요. 신청함에서 '담기'를 누르거나 오른쪽에서 바로 추가하세요.") : "불러오는 중…"}</div>`;
    cart.sort((a, b) => (a.createdAt || "").localeCompare(b.createdAt || "")).forEach(it => cl.append(cartRow(it, editable)));

    // wish
    const wl = $("wishList"); wl.innerHTML = "";
    if (!wish.length) wl.innerHTML = `<div class="empty">${state.loaded ? "신청된 간식이 없어요. 링크 없이 '단백질음료'처럼 키워드만 올려도 돼요." : "불러오는 중…"}</div>`;
    wish.sort((a, b) => votesOf(b.id).length - votesOf(a.id).length || (a.createdAt || "").localeCompare(b.createdAt || ""))
        .forEach(it => wl.append(wishRow(it, editable, remain)));

    // add form
    $("addPanel").hidden = !can;
    [...$("addForm").elements].forEach(el => el.disabled = !editable);
    $("fitHint").textContent = locked ? "주문 완료된 달이에요. '다시 열기'를 누르면 수정할 수 있어요." : fitText();

    renderShelf(editable);
    $("csvBtn").hidden = !downloads;
    fillNames();
  }

  function metaLine(it) {
    const bits = [];
    if (it.by) bits.push(`<span data-uid="${esc(it.by)}">…</span>`);
    else if (it.src === "xlsx") bits.push("엑셀에서 가져옴");
    if (it.price) bits.push(`<span class="num">${won(it.price)}원 × ${it.qty || 1}</span>`);
    const seen = history().get(keyOf(it));
    if (seen && seen.months.filter(m => m !== it.month).length) bits.push(`이전에 ${seen.months.filter(m => m !== it.month).length}번 주문`);
    return bits.join(" · ");
  }
  function nameHtml(it) {
    const u = safeUrl(it.url);
    return u ? `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(it.name)} ↗</a>` : esc(it.name);
  }

  function cartRow(it, editable) {
    const r = document.createElement("div"); r.className = "row";
    r.innerHTML = `<div><div class="name">${nameHtml(it)}</div><div class="meta">${metaLine(it)}</div></div>
      <div class="right">
        ${editable ? `<span class="qty"><button aria-label="하나 빼기" data-a="minus">−</button><span>${it.qty || 1}</span><button aria-label="하나 더" data-a="plus">+</button></span>` : `<span class="muted num">×${it.qty || 1}</span>`}
        ${editable ? `<input class="price${it.price ? "" : " missing"}" id="p-${esc(it.id)}" inputmode="numeric" aria-label="가격" value="${it.price ? won(it.price) : ""}" placeholder="가격?">` : ""}
        <span class="sub">${it.price ? won(it.price * (it.qty || 1)) + "원" : "—"}</span>
        ${editable ? `<button class="btn ghost small" data-a="back" title="신청함으로 돌려보내기">빼기</button><button class="x" data-a="del" aria-label="삭제">✕</button>` : ""}
      </div>`;
    wireRow(r, it);
    return r;
  }

  function wishRow(it, editable, remain) {
    const vs = votesOf(it.id), mine = vs.some(v => v.uid === state.uid);
    const cost = (it.price || 0) * (it.qty || 1);
    const fits = it.price ? cost <= remain : null;
    const r = document.createElement("div"); r.className = "row";
    r.innerHTML = `<div><div class="name">${nameHtml(it)} ${it.url ? "" : '<span class="tag">키워드</span>'} ${fits === false ? `<span class="tag warn">${won(cost - remain)}원 초과</span>` : ""}</div><div class="meta">${metaLine(it)}</div></div>
      <div class="right">
        <button class="vote${mine ? " on" : ""}" data-a="vote" ${state.canWrite && db && state.uid ? "" : "disabled"} aria-pressed="${mine}">👍 <span class="num">${vs.length}</span></button>
        ${editable ? `${it.price ? "" : `<input class="price missing" id="p-${esc(it.id)}" inputmode="numeric" aria-label="가격" placeholder="가격?">`}<button class="btn" data-a="cart">담기</button><button class="x" data-a="del" aria-label="삭제">✕</button>` : ""}
      </div>`;
    wireRow(r, it);
    return r;
  }

  function wireRow(r, it) {
    r.addEventListener("click", e => {
      const a = e.target.closest("[data-a]")?.dataset.a; if (!a) return;
      if (a === "plus") upd(it.id, { qty: (it.qty || 1) + 1 });
      if (a === "minus") { if ((it.qty || 1) > 1) upd(it.id, { qty: it.qty - 1 }); }
      if (a === "back") upd(it.id, { status: "wish" });
      if (a === "cart") upd(it.id, { status: "cart" });
      if (a === "del") { const btn = e.target.closest("button"); if (btn.dataset.confirm) delItem(it.id); else { btn.dataset.confirm = "1"; btn.textContent = "삭제?"; btn.style.width = "auto"; setTimeout(() => { if (btn.isConnected) { delete btn.dataset.confirm; btn.textContent = "✕"; btn.style.width = ""; } }, 2500); } }
      if (a === "vote") toggleVote(it);
    });
    const p = r.querySelector("input.price");
    if (p) p.addEventListener("change", () => { const n = toNum(p.value); if (n !== (it.price || null)) upd(it.id, { price: n }); });
    if (p) p.addEventListener("keydown", e => { if (e.key === "Enter") p.blur(); });
  }

  function toggleVote(it) {
    if (!db || !state.uid) return;
    const id = (it.id + "__" + state.uid).replace(/[^A-Za-z0-9_\-.~:@+]/g, "_");
    const mine = state.votes.find(v => v.id === id);
    guard(mine ? db.doc("votes/" + id).delete() : db.doc("votes/" + id).set({ item: it.id, uid: state.uid }));
  }

  // history across months: grouped by Coupang product, else by name
  const keyOf = it => it.pid || (it.name || "").replace(/\s+/g, "").toLowerCase();
  let _hist = null;
  function history() {
    if (_hist) return _hist;
    const map = new Map();
    for (const it of state.items) {
      if (it.status !== "cart") continue;
      const k = keyOf(it); if (!k) continue;
      const h = map.get(k) || { months: [], last: null };
      if (!h.months.includes(it.month)) h.months.push(it.month);
      if (!h.last || it.month > h.last.month) h.last = it;
      map.set(k, h);
    }
    return (_hist = map);
  }

  function renderShelf(editable) {
    const k = state.month, here = new Set(itemsOf(k).map(keyOf));
    const rows = [...history().entries()]
      .map(([key, h]) => ({ key, ...h, past: h.months.filter(m => m !== k) }))
      .filter(h => h.past.length)
      .sort((a, b) => b.past.length - a.past.length || b.last.month.localeCompare(a.last.month))
      .slice(0, 12);
    const el = $("shelf"); el.innerHTML = "";
    if (!rows.length) { el.innerHTML = `<div class="empty">${state.loaded ? "주문 기록이 쌓이면 여기에 자주 산 간식이 모여요." : "불러오는 중…"}</div>`; return; }
    for (const h of rows) {
      const it = h.last, r = document.createElement("div"); r.className = "row";
      const inMonth = here.has(h.key);
      r.innerHTML = `<div><div class="name">${nameHtml(it)}</div><div class="meta"><span class="count">${h.past.length}회</span><span class="num">최근 ${won(it.price)}원</span><span>${h.past.sort().map(m => Number(m.slice(5)) + "월").join(", ")}</span></div></div>
        <div class="right">${inMonth ? '<span class="tag">이번 달에 있음</span>' : editable ? '<button class="btn" data-a="re">다시 담기</button>' : ""}</div>`;
      const btn = r.querySelector("[data-a=re]");
      if (btn) btn.onclick = () => addItem({ month: k, name: it.name, qty: 1, price: it.price || null, url: safeUrl(it.url), pid: it.pid || null, status: "cart" }).then(() => toast("장바구니에 담았어요 · 가격이 바뀌었는지 링크에서 확인하세요"));
      el.append(r);
    }
  }

  let nameTimer;
  function fillNames() {
    clearTimeout(nameTimer);
    nameTimer = setTimeout(async () => {
      const els = [...document.querySelectorAll("[data-uid]")]; if (!els.length) return;
      const ids = [...new Set(els.map(e => e.dataset.uid))];
      let ps = {};
      try { ps = user ? await user.profiles(ids) : {}; } catch {}
      els.forEach(e => { const p = ps[e.dataset.uid]; e.textContent = p ? (p.isMe ? "내가 올림" : (p.name || "동료") + " 님") : "동료"; });
    }, 30);
  }

  // ---------- add form ----------
  function fitText() {
    const md = monthDoc(state.month), remain = (md.budget ?? DEFAULT_BUDGET) - total(itemsOf(state.month, "cart"));
    const n = toNum($("fPrice").value), q = Math.max(1, parseInt($("fQty").value, 10) || 1);
    if (!n) return `지금 남은 예산 ${won(remain)}원`;
    const after = remain - n * q;
    return after >= 0 ? `장바구니에 담으면 잔액 ${won(after)}원` : `장바구니에 담으면 ${won(-after)}원 초과`;
  }
  $("fUrl").addEventListener("input", () => {
    const p = parseCoupang($("fUrl").value), h = $("urlHint");
    h.className = "hint";
    if (!p) { h.textContent = "링크를 붙여넣으면 추적용 파라미터를 지우고 짧게 저장해요."; return; }
    if (p.bad) { h.textContent = "https:// 로 시작하는 링크를 넣어주세요."; return; }
    h.className = "hint ok";
    h.textContent = p.pid ? "쿠팡 상품 링크 확인 · 짧게 정리해서 저장해요" : "링크 저장됨";
    if (p.q && !$("fName").value) $("fName").value = p.q;
    const seen = p.pid && history().get(p.pid);
    if (seen) { h.textContent += ` · 전에 ${seen.months.length}번 산 상품 (최근 ${won(seen.last.price)}원)`; if (!$("fName").value || $("fName").value === p.q) $("fName").value = seen.last.name; if (!$("fPrice").value && seen.last.price) $("fPrice").value = won(seen.last.price); }
    $("fitHint").textContent = fitText();
  });
  $("fPrice").addEventListener("input", () => { const n = toNum($("fPrice").value); $("fPrice").value = n ? won(n) : ""; $("fitHint").textContent = fitText(); });
  $("fQty").addEventListener("input", () => { $("fitHint").textContent = fitText(); });
  $("addForm").addEventListener("submit", e => {
    e.preventDefault();
    const name = $("fName").value.trim(); if (!name) return;
    const p = parseCoupang($("fUrl").value);
    if (p && p.bad) { toast("링크 형식을 확인해주세요"); return; }
    const dest = $("destCart").checked ? "cart" : "wish";
    addItem({ month: state.month, name, qty: Math.max(1, parseInt($("fQty").value, 10) || 1), price: toNum($("fPrice").value), url: p ? p.url : "", pid: p ? p.pid : null, status: dest })
      .then(() => toast(dest === "cart" ? "장바구니에 담았어요" : "신청함에 올렸어요"));
    $("addForm").reset(); $("fQty").value = 1; $("urlHint").className = "hint"; $("urlHint").textContent = "링크를 붙여넣으면 추적용 파라미터를 지우고 짧게 저장해요."; $("fitHint").textContent = fitText();
  });

  // ---------- header controls ----------
  $("prevM").onclick = () => { state.month = shift(state.month, -1); saveMonth(state.month); render(); };
  $("nextM").onclick = () => { state.month = shift(state.month, 1); saveMonth(state.month); render(); };
  $("budget").addEventListener("change", () => { const n = toNum($("budget").value); if (n) setMonth(state.month, { budget: n }); });
  $("budget").addEventListener("keydown", e => { if (e.key === "Enter") e.target.blur(); });
  $("orderBtn").onclick = () => {
    const md = monthDoc(state.month);
    if (md.ordered) setMonth(state.month, { ordered: false, orderedAt: null });
    else setMonth(state.month, { ordered: true, orderedAt: new Date().toISOString().slice(0, 10) }).then(() => toast("주문 완료로 표시했어요"));
  };

  function orderText() {
    const k = state.month, cart = itemsOf(k, "cart"), md = monthDoc(k), b = md.budget ?? DEFAULT_BUDGET, s = total(cart);
    const lines = [`[${mlabel(k)} 부서 간식]`];
    cart.forEach((it, i) => { lines.push(`${i + 1}. ${it.name} ×${it.qty || 1}  ${it.price ? won(it.price * (it.qty || 1)) + "원" : "가격 미정"}`); if (it.url) lines.push(`   ${it.url}`); });
    lines.push(`합계 ${won(s)}원 / 예산 ${won(b)}원 / 잔액 ${won(b - s)}원`);
    return lines.join("\n");
  }
  $("copyBtn").onclick = () => {
    const t = orderText();
    $("copyText").value = t;
    navigator.clipboard.writeText(t).then(() => toast("복사했어요 · 메신저에 붙여넣으세요"), () => { $("copyWrap").hidden = false; $("copyWrap").open = true; $("copyText").select(); toast("아래 칸에서 직접 복사해주세요"); });
  };
  $("csvBtn").onclick = async () => {
    if (!downloads) return;
    const k = state.month, rows = [["항목", "개수", "금액", "소계", "링크"]];
    itemsOf(k, "cart").forEach(it => rows.push([it.name, it.qty || 1, it.price || "", (it.price || 0) * (it.qty || 1), it.url || ""]));
    const s = total(itemsOf(k, "cart")), b = monthDoc(k).budget ?? DEFAULT_BUDGET;
    rows.push([], ["", "합계", "", s, ""], ["", "잔액", "", b - s, ""]);
    const csv = "﻿" + rows.map(r => r.map(c => { const v = String(c ?? ""); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }).join(",")).join("\r\n");
    try { await downloads.save({ filename: `간식_${k.slice(2).replace("-", ".")}.csv`, data: new Blob([csv], { type: "text/csv" }) }); }
    catch (e) { if (e && e.code !== "cancelled") toast("파일을 저장하지 못했어요"); }
  };

  // ---------- boot ----------
  render();
  (async () => {
    const use = n => (window.claude && window.claude.use) ? window.claude.use(n).catch(() => null) : Promise.resolve(null);
    [db, user, downloads] = await Promise.all([use("db"), use("user"), use("downloads")]);
    if (!db) { state.loaded = true; state.canWrite = false; notice("로그인하면 부서 장바구니를 보고 함께 편집할 수 있어요."); render(); return; }
    if (user) {
      state.uid = await user.id();
      const c = await user.can("data.write");
      if (c === false) { state.canWrite = false; notice("보기 전용으로 열려 있어요. 간식을 신청하려면 문서 주인에게 Contributor 권한을 요청하세요."); }
    }
    const timer = setTimeout(() => { if (!state.loaded) notice("데이터를 아직 불러오지 못했어요. 네트워크를 확인해주세요."); }, 10000);
    let got = 0;
    const done = snap => { if (!snap.metadata.fromCache && ++got >= 3) { state.loaded = true; clearTimeout(timer); if ($("notice").textContent.startsWith("데이터를")) notice(""); } };
    const fail = () => { clearTimeout(timer); state.loaded = true; notice("데이터 연결이 끊겼어요. 페이지를 다시 열어주세요."); render(); };
    db.collection("items").onSnapshot(s => { state.items = s.docs.map(d => ({ id: d.id, ...d.data() })); _hist = null; done(s); render(); }, fail);
    db.collection("months").onSnapshot(s => { state.months = Object.fromEntries(s.docs.map(d => [d.id, d.data()])); done(s); render(); }, fail);
    db.collection("votes").onSnapshot(s => { state.votes = s.docs.map(d => ({ id: d.id, ...d.data() })); done(s); render(); }, fail);
  })();
})();
</script>
